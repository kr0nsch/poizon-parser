<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Поиск обуви на POIZON по длине стопы, наличию и цене."
    />
    <meta name="theme-color" content="#f5f5f2" />
    <title>POIZON — обувь по вашему размеру</title>
    <script>
      // Правило getInitialTheme из src/lib/storage.ts: чужое значение или
      // недоступное хранилище — тема системы.
      ;(() => {
        let saved = null
        try {
          saved = localStorage.getItem('poizon-theme')
        } catch {}
        const dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
